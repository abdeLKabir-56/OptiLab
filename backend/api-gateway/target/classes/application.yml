spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedHeaders: "*"
            allowedMethods: "*"
      discovery:
        locator:
          enabled: true
  #zipkin:
    #base-url: http://localhost:9411

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive: DEBUG

management:
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0

  #cloud:
    #gateway:
      #routes:
        #- id: laboratoire
          #uri: lb://LABORATOIRE
          #predicates:
            #- Path=/api/v1/laboratoires/**
        #- id: contact
          #uri: lb://LABORATOIRE
          #predicates:
            #- Path=/api/v1/contacts-laboratoire/**
        #- id: address
          #uri: lb://LABORATOIRE
          #predicates:
            #- Path=/api/v1/adresses/**
server:
  port: 8888

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
