# Application Configuration
spring:
  application:
    name: laboratoire

  # Data Source Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/laboratoires
    username: idhem
    password: idhem
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: 'true'
    hibernate:
      ddl-auto: update

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "http://localhost:8089/realms/optilab-realm"
          jwk-set-uri: "http://localhost:8089/realms/optilab-realm/protocol/openid-connect/certs"

# Logging Configuration
logging:
  level:
    org.springframework.security: DEBUG

# Management Configuration
management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    export:
      zipkin:
        enabled: true

# JWT Configuration
jwt:
  auth:
    converter:
      resource-id: optilab-client
      principle-attribute: preferred_username

# Server Configuration
server:
  port: 8080

# Eureka Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka